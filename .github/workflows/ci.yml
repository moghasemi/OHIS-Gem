name: OHIS Monorepo CI - Phase 6.2 Skeleton

on:
  push:
    branches: [ feature/phase-6.2-project-skeleton ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-and-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ohis_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository (All Refs, No Credential Persistence)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python Runtime (Target 3.11)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements/development.txt
            backend/requirements/testing.txt
            backend/requirements/constraints.txt

      - name: Install Backend Dependencies with Constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/development.txt -c backend/requirements/constraints.txt
          python -m pip install -r backend/requirements/testing.txt -c backend/requirements/constraints.txt
          pip check

      - name: Run Secret Scanner Self-Tests and Full Repository Scan
        run: |
          PYTHONPATH=tools python tools/test_secret_scanner.py
          python tools/secret_scanner.py --all-refs

      - name: Validate Strict Secret Key Enforcement (Production Settings)
        run: |
          cd backend && python -c "
          import os, sys
          from django.core.exceptions import ImproperlyConfigured
          os.environ.pop('SECRET_KEY', None)
          try:
              import config.settings.production
              sys.stderr.write('CRITICAL: production loaded without SECRET_KEY\n')
              sys.exit(1)
          except ImproperlyConfigured as err:
              if 'SECRET_KEY' in str(err):
                  sys.stdout.write('PASS: Correctly rejected empty SECRET_KEY with ImproperlyConfigured\n')
                  sys.exit(0)
              sys.stderr.write(f'FAIL: Unexpected message: {err}\n')
              sys.exit(1)
          except Exception as err:
              sys.stderr.write(f'FAIL: Unexpected exception type: {type(err).__name__}\n')
              sys.exit(1)
          "

      - name: Django System Checks (Development, Testing, Staging, Production)
        env:
          SECRET_KEY: temporary-ci-validation-secret-key-12345
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DB_NAME: ohis_test_db
          DB_USER: test_user
          DB_PASSWORD: test_password_secure_123
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          cd backend
          python manage.py check --settings=config.settings.development
          python manage.py check --settings=config.settings.testing
          python manage.py check --settings=config.settings.staging
          python manage.py check --settings=config.settings.production
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Integration Tests (Live PostgreSQL and Redis)
        env:
          PYTHONPATH: backend
          SECRET_KEY: temporary-ci-validation-secret-key-12345
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: ohis_test_db
          DB_USER: test_user
          DB_PASSWORD: test_password_secure_123
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          PYTHONPATH=backend pytest tests/integration/ -v

      - name: Generate Temporary CI Environment File for Docker Compose
        run: |
          cat << 'EOF' > deployment/ci.env
          SECRET_KEY=ci_dummy_secret_key_for_docker_compose_config_validation_only_12345
          POSTGRES_DB=ohis_test_db
          POSTGRES_USER=ci_dummy_user
          POSTGRES_PASSWORD=ci_dummy_password_not_for_production_use
          REDIS_PASSWORD=ci_dummy_redis_password_not_for_production_use
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          EOF

      - name: Validate Presence of Mandatory Variables in ci.env
        run: |
          test -f deployment/ci.env || (echo "ci.env missing" && exit 1)
          grep -q '^SECRET_KEY=' deployment/ci.env || exit 1
          grep -q '^POSTGRES_PASSWORD=' deployment/ci.env || exit 1

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose --env-file deployment/ci.env config --quiet

      - name: Build Backend Docker Image
        run: |
          docker compose --env-file deployment/ci.env build backend

      - name: Verify Gunicorn Is Installed in the Production Image
        run: |
          docker compose --env-file deployment/ci.env run --no-deps --rm backend gunicorn --version

      - name: Run Django System Checks inside the Built Docker Container
        run: |
          docker compose --env-file deployment/ci.env run --no-deps --rm backend python manage.py check --settings=config.settings.development
          docker compose --env-file deployment/ci.env run --no-deps --rm backend python manage.py check --settings=config.settings.production

      - name: Clean Temporary CI Environment File
        if: always()
        run: |
          rm -f deployment/ci.env

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository (No Credential Persistence)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Frontend Dependencies (Frozen Lockfile)
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: TypeScript Static Type Checking
        run: |
          cd frontend
          bun run typecheck

      - name: Production Vite Build
        run: |
          cd frontend
          bun run build
